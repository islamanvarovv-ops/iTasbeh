<!DOCTYPE html>
<html lang="uz" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iTasbeh</title>
    
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="logo.png">
    
    <meta name="theme-color" content="#030712">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>

    <div class="glow-orb glow-1"></div>
    <div class="glow-orb glow-2"></div>
    <div class="confetti-box" id="confettiBox"></div>

    <!-- Header -->
    <header class="top-nav">
        <div class="timer-box">
            <span class="timer-text" id="timerDisplay">00:00:00</span>
            <button class="glass-btn" id="freezeToggleBtn" title="Vaqtni muzlatish">
                <svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
        </div>
        <div class="nav-actions">
            <button class="glass-btn" id="vibroToggleBtn" title="Vibratsiya">
                <svg viewBox="0 0 24 24"><path d="M16 4.01C17.1 4.01 18 4.9 18 6v12c0 1.1-.9 1.99-2 1.99H8c-1.1 0-2-.89-2-1.99V6c0-1.1.9-1.99 2-1.99h8zM16 2H8C5.79 2 4 3.79 4 6v12c0 2.21 1.79 4 4 4h8c2.21 0 4-1.79 4-4V6c0-2.21-1.79-4-4-4zm-4 15c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
            </button>
            <button class="glass-btn" id="soundToggleBtn" title="Ovoz">
                <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
            </button>
            <button class="glass-btn" id="themeToggleBtn" title="Mavzu">
                <svg viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5z"/></svg>
            </button>
        </div>
    </header>

    <!-- Main -->
    <main class="main-stage">
        <div class="duo-glass-card">
            <p class="duo-text" id="duoDisplay">Subhanalloh</p>
        </div>
        <div class="counter-glass-box">
            <div class="counter-number" id="counterDisplay">0</div>
        </div>
    </main>

    <!-- Controls -->
    <footer class="bottom-stage">
        <button class="btn-plus-glass" id="plusBtn">+</button>
        <div class="bottom-row">
            <button class="reset-glass-btn" id="resetBtn">Tozalash</button>
            <button class="taqvim-glass-btn" id="taqvimOpenBtn">
                <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/></svg>
                Namoz vaqtlari
            </button>
        </div>
    </footer>

    <!-- Taqvim Modal -->
    <div class="modal-overlay" id="taqvimModal">
        <div class="glass-modal">
            <div class="modal-head">
                <h3>Namoz Vaqtlari</h3>
                <button class="close-btn" id="taqvimCloseBtn">
                    <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </button>
            </div>
            <div class="taqvim-box">
                <div class="taqvim-date" id="todayDateLabel">Yuklanmoqda...</div>
                <div class="time-row"><span class="time-name">Bomdod</span><span class="time-val" id="timeBomdod">--:--</span></div>
                <div class="time-row"><span class="time-name">Quyosh</span><span class="time-val" id="timeQuyosh">--:--</span></div>
                <div class="time-row"><span class="time-name">Peshin</span><span class="time-val" id="timePeshin">--:--</span></div>
                <div class="time-row"><span class="time-name">Asr</span><span class="time-val" id="timeAsr">--:--</span></div>
                <div class="time-row"><span class="time-name">Shom</span><span class="time-val" id="timeShom">--:--</span></div>
                <div class="time-row"><span class="time-name">Xufton</span><span class="time-val" id="timeXufton">--:--</span></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
