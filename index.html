<!DOCTYPE html>
<html lang="uz" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iTasbeh</title>
    <!-- Brauzer tabidagi ikonka -->
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="manifest" href="manifest.json">

    <!-- iPhone / iOS ekraniga saqlaganda chiqadigan App Icon -->
    <link rel="apple-touch-icon" href="logo.png">

    <!-- Mobil brauzer tepasining rangini ikonka foniga moslash -->
    <meta name="theme-color" content="#1a2e6e">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #070a14;
            --text-color: #f8fafc;
            --card-text: #e2e8f0;

            /* Glass Matte Theme Variables (Dark) */
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-blur: blur(24px);
            --glass-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.1);

            --timer-color: #94a3b8;
            --btn-reset-color: #94a3b8;
            --counter-grad-1: #ffffff;
            --counter-grad-2: #94a3b8;

            --panel-bg: rgba(13, 18, 30, 0.75);
            --panel-border: rgba(255, 255, 255, 0.15);
            --input-bg: rgba(255, 255, 255, 0.06);
            --input-border: rgba(255, 255, 255, 0.12);
            --input-text: #ffffff;
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --text-color: #0f172a;
            --card-text: #334155;

            /* Glass Matte Theme Variables (Light) */
            --glass-bg: rgba(255, 255, 255, 0.55);
            --glass-border: rgba(255, 255, 255, 0.7);
            --glass-blur: blur(24px);
            --glass-shadow: 0 20px 40px rgba(31, 38, 135, 0.08), inset 0 1px 1px rgba(255, 255, 255, 0.9);

            --timer-color: #64748b;
            --btn-reset-color: #64748b;
            --counter-grad-1: #0f172a;
            --counter-grad-2: #475569;

            --panel-bg: rgba(255, 255, 255, 0.75);
            --panel-border: rgba(255, 255, 255, 0.6);
            --input-bg: rgba(0, 0, 0, 0.04);
            --input-border: rgba(0, 0, 0, 0.08);
            --input-text: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            width: 100vw;
            height: 100vh;
            height: -webkit-fill-available;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 24px 16px 20px 16px;
            /* Padding-top to'g'irlandi */
            overflow: hidden;
            position: relative;
            transition: background 0.4s ease;
        }

        /* 🌈 HARAKATLANUVCHI GRADIENT SHARLAR (BACKGROUND) */
        .bg-glow {
            position: absolute;
            border-radius: 50%;
            z-index: -1;
            filter: blur(90px);
            opacity: 0.28;
            pointer-events: none;
            will-change: transform;
        }

        .glow-1 {
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, #3b82f6, #1d4ed8);
            top: -60px;
            left: -60px;
            animation: floatGlow1 14s ease-in-out infinite alternate;
        }

        .glow-2 {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, #8b5cf6, #6d28d9);
            bottom: -80px;
            right: -80px;
            animation: floatGlow2 16s ease-in-out infinite alternate;
        }

        .glow-3 {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, #06b6d4, #0284c7);
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: floatGlow3 18s ease-in-out infinite alternate;
        }

        @keyframes floatGlow1 {
            0% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(60px, 40px) scale(1.1);
            }

            100% {
                transform: translate(-20px, 80px) scale(0.9);
            }
        }

        @keyframes floatGlow2 {
            0% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(-50px, -60px) scale(1.15);
            }

            100% {
                transform: translate(30px, -30px) scale(0.95);
            }
        }

        @keyframes floatGlow3 {
            0% {
                transform: translate(-50%, -50%) scale(0.9);
            }

            50% {
                transform: translate(-30%, -40%) scale(1.2);
            }

            100% {
                transform: translate(-70%, -60%) scale(1);
            }
        }

        .confetti-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 999;
        }

        .confetti {
            position: absolute;
            width: 6px;
            height: 6px;
            background-color: #60a5fa;
            animation: fall 1.4s ease-out forwards;
            border-radius: 50%;
            opacity: 0.8;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg) scale(1);
                opacity: 1;
            }

            100% {
                transform: translateY(200px) rotate(360deg) scale(0.2);
                opacity: 0;
            }
        }

        /* Yuqori boshqaruv paneli (Glass Matte) */
        .top-controls {
            width: 100%;
            max-width: 380px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            padding: 8px 12px;
            border-radius: 20px;
            box-shadow: var(--glass-shadow);
        }

        .timer-freeze-group {
            display: flex;
            align-items: center;
            gap: 8px;
            padding-left: 4px;
        }

        .timer {
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--timer-color);
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.03em;
        }

        .actions-group {
            display: flex;
            gap: 6px;
        }

        .icon-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-color);
            width: 36px;
            height: 36px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .icon-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .icon-btn:hover {
            background: var(--input-bg);
            border-color: var(--glass-border);
        }

        .icon-btn:active {
            transform: scale(0.92);
        }

        .icon-btn.active-freeze {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.3);
        }

        /* Asosiy kontent maydoni */
        .main-content {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin: auto 0;
        }

        /* Duo karta - Glass Matte Container */
        .duo-card {
            width: 100%;
            margin: 30px;
            padding: 20px;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: var(--glass-shadow);
            min-height: 125px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .duo-text {
            font-size: 1.1rem;
            font-weight: 400;
            line-height: 1.55;
            color: var(--card-text);
            animation: fadeIn 0.3s ease;
            word-break: break-word;
        }

        /* Counter qismi - Glass Badge */
        .counter-wrapper {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            padding: 12px 36px;
            border-radius: 22px;
            box-shadow: var(--glass-shadow);
            display: inline-flex;
            justify-content: center;
            align-items: center;
        }

        .counter-value {
            font-size: 4.8rem;
            font-weight: 600;
            line-height: 1;
            background: linear-gradient(180deg, var(--counter-grad-1) 0%, var(--counter-grad-2) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            user-select: none;
            letter-spacing: -1px;
            font-variant-numeric: tabular-nums;
        }

        /* Pastki boshqaruv paneli */
        .bottom-panel {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        /* Premium Glass Plus Tugmasi */
        .btn-plus {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.25);
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.9) 0%, rgba(37, 99, 235, 0.9) 100%);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            color: white;
            font-size: 2.5rem;
            font-weight: 300;
            cursor: pointer;
            display: flex;
            margin-top: 30px;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.35), inset 0 2px 4px rgba(255, 255, 255, 0.3);
            transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s ease;
            outline: none;
        }

        .btn-plus:active {
            transform: scale(0.92);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.25);
        }

        .btn-reset {
            background: transparent;
            border: none;
            color: var(--btn-reset-color);
            font-size: 0.75rem;
            cursor: pointer;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 8px 16px;
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .btn-reset:hover {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
        }

        /* GLASS MATTE MODAL OVERLAY (UMUMIY) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--panel-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            width: 100%;
            max-width: 400px;
            max-height: 82vh;
            border-radius: 28px 28px 0 0;
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 -20px 50px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.2);
            border: 1px solid var(--panel-border);
            border-bottom: none;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            overflow-y: auto;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .close-modal {
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .close-modal svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        /* RESET CONFIRMATION MODAL (GLASS MATTE FLOATING) */
        .reset-modal-overlay {
            align-items: center;
            /* Markazga keltirildi (Floating Message / UI-UX) */
        }

        .reset-modal-content {
            align-self: center;
            margin: auto;
            border-radius: 28px;
            border: 1px solid var(--panel-border);
            text-align: center;
            padding: 24px;
            gap: 18px;
            width: 90%;
            max-width: 340px;
            transform: scale(0.9);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.25);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-overlay.active .reset-modal-content {
            transform: scale(1);
        }

        .reset-modal-title {
            font-size: 1.05rem;
            font-weight: 600;
        }

        .reset-modal-desc {
            font-size: 0.85rem;
            color: var(--timer-color);
            line-height: 1.4;
        }

        .reset-modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 6px;
        }

        .btn-confirm-yes {
            flex: 1;
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 14px;
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
            transition: transform 0.15s ease, opacity 0.2s;
        }

        .btn-confirm-no {
            flex: 1;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-color);
            padding: 12px;
            border-radius: 14px;
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-confirm-yes:active,
        .btn-confirm-no:active {
            transform: scale(0.95);
        }

        /* ADMIN SECTION */
        .admin-section {
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .admin-section label {
            font-size: 0.75rem;
            color: var(--timer-color);
            font-weight: 500;
        }

        .admin-section textarea,
        .admin-section input[type="text"],
        .admin-section input[type="range"] {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--input-text);
            padding: 10px;
            border-radius: 12px;
            font-size: 0.85rem;
            outline: none;
            resize: none;
            transition: border-color 0.2s;
        }

        .admin-section textarea:focus {
            border-color: rgba(59, 130, 246, 0.5);
        }

        .admin-section textarea {
            height: 65px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 500;
            width: 100%;
            font-size: 0.82rem;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.25);
            transition: opacity 0.2s;
        }

        .btn-primary:active {
            opacity: 0.9;
        }

        .duo-list-admin {
            max-height: 180px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .duo-item-admin {
            display: flex;
            flex-direction: column;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            padding: 10px;
            border-radius: 12px;
            font-size: 0.78rem;
            gap: 8px;
        }

        .duo-item-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .duo-item-top span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--text-color);
            font-weight: 500;
        }

        .duo-edit-area {
            display: none;
            flex-direction: column;
            gap: 6px;
        }

        .duo-edit-area textarea {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--input-border);
            color: var(--input-text);
            padding: 8px;
            border-radius: 8px;
            font-size: 0.78rem;
            resize: none;
            height: 50px;
            outline: none;
        }

        .duo-item-actions {
            display: flex;
            gap: 6px;
        }

        .btn-action {
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.72rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: transform 0.1s;
        }

        .btn-action svg {
            width: 12px;
            height: 12px;
            fill: currentColor;
        }

        .btn-action:active {
            transform: scale(0.95);
        }

        .btn-edit {
            background: rgba(59, 130, 246, 0.12);
            color: #3b82f6;
        }

        .btn-save {
            background: #10b981;
            color: white;
        }

        .btn-cancel {
            background: var(--glass-bg);
            color: var(--timer-color);
            border: 1px solid var(--glass-border);
        }

        .btn-delete {
            background: rgba(239, 68, 68, 0.12);
            color: #ef4444;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(3px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 🔮 GLASS MATTE FLOATING INSTALL BANNER UI/UX */
        .pwa-glass-banner {
            position: fixed;
            bottom: -220px;
            /* Boshida yashirin turadi */
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 0 16px;
            z-index: 2000;
            pointer-events: none;
            transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
            opacity: 0;
        }

        .pwa-glass-banner.show {
            transform: translateY(-24px);
            /* Silliq suzib chiqadi */
            opacity: 1;
            pointer-events: auto;
        }

        .pwa-glass-card {
            width: 100%;
            max-width: 380px;
            background: var(--panel-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--panel-border);
            border-radius: 26px;
            padding: 16px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .pwa-glass-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .pwa-app-icon {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            object-fit: cover;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.25);
            border: 1px solid var(--glass-border);
        }

        .pwa-app-info {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .pwa-app-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-color);
            letter-spacing: -0.01em;
        }

        .pwa-app-sub {
            font-size: 0.72rem;
            color: #3b82f6;
            font-weight: 500;
            margin-top: 1px;
        }

        .pwa-glass-desc {
            font-size: 0.8rem;
            color: var(--timer-color);
            line-height: 1.4;
            text-align: left;
            margin: 0 2px;
        }

        .pwa-glass-actions {
            display: flex;
            gap: 10px;
            margin-top: 2px;
        }

        .pwa-btn-install {
            flex: 1;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            border: none;
            padding: 11px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 0.82rem;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(59, 130, 246, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.3);
            transition: transform 0.15s ease, opacity 0.2s;
        }

        .pwa-btn-cancel {
            flex: 0.8;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-color);
            padding: 11px;
            border-radius: 14px;
            font-weight: 500;
            font-size: 0.82rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .pwa-btn-install:active,
        .pwa-btn-cancel:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body>

    <!-- 🌈 HARAKATLANUVCHI GRADIENT SHARLAR -->
    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>
    <div class="bg-glow glow-3"></div>

    <div class="confetti-container" id="confettiContainer"></div>

    <!-- Yuqori panel -->
    <div class="top-controls">
        <div class="timer-freeze-group">
            <div class="timer" id="timerDisplay">00:00:00</div>
            <button class="icon-btn" id="freezeToggleBtn" title="Pauza / Freeze">
                <svg viewBox="0 0 24 24">
                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
                </svg>
            </button>
        </div>
        <div class="actions-group">
            <button class="icon-btn" id="vibroToggleBtn" title="Tebranishni yoqish/o'chirish">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M16 4.01C17.1 4.01 18 4.9 18 6v12c0 1.1-.9 1.99-2 1.99H8c-1.1 0-2-.89-2-1.99V6c0-1.1.9-1.99 2-1.99h8zM16 2H8C5.79 2 4 3.79 4 6v12c0 2.21 1.79 4 4 4h8c2.21 0 4-1.79 4-4V6c0-2.21-1.79-4-4-4zm-4 15c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z" />
                </svg>
            </button>
            <button class="icon-btn" id="soundToggleBtn" title="Ovozni yoqish/o'chirish">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" />
                </svg>
            </button>
            <button class="icon-btn" id="themeToggleBtn" title="Rejimni o'zgartirish">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-.39-1.03-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z" />
                </svg>
            </button>
            <button class="icon-btn" id="adminOpenBtn" title="Admin panel">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" />
                </svg>
            </button>
        </div>
    </div>
    <!-- PREMIUM GLASS MATTE FLOATING INSTALL BANNER -->
    <div id="pwaInstallBanner" class="pwa-glass-banner">
        <div class="pwa-glass-card">
            <div class="pwa-glass-header">
                <img src="logo.png" alt="iTasbeh Logo" class="pwa-app-icon">
                <div class="pwa-app-info">
                    <span class="pwa-app-title">iTasbeh App</span>
                    <span class="pwa-app-sub">Offlayn rejimda tekor ishlaydi</span>

            <p class="pwa-glass-desc">
                Ilovani qurilmangizga o'rnatib, internet bo'lmaganda ham silliq ishlating.
            </p>
            <div class="pwa-glass-actions">
                <button id="pwaDismissBtn" class="pwa-btn-cancel">Keyinroq</button>
                <button id="pwaInstallBtn" class="pwa-btn-install">Yuklab olish</button>

        </div>
    </div>
    <!-- Asosiy Kontent -->
    <div class="main-content">
        <div class="duo-card">
            <p class="duo-text" id="duoDisplay">Yuklanmoqda...</p>
        </div>
        <div class="counter-wrapper">
            <div class="counter-value" id="counterDisplay">0</div>
        </div>
    </div>

    <div class="bottom-panel">
        <button class="btn-plus" id="plusBtn" aria-label="Qo'shish">+</button>
        <button class="btn-reset" id="resetBtn">Tozalash</button>
    </div>

    <!-- RESET CONFIRMATION MODAL (GLASS MATTE FLOATING) -->
    <div class="modal-overlay reset-modal-overlay" id="resetConfirmModal">
        <div class="modal-content reset-modal-content">
            <div class="reset-modal-title">Tozalashni tasdiqlang</div>
            <div class="reset-modal-desc">Rostan ham hisob va vaqtni boshqatdan nollashtirmoqchimisiz?</div>
            <div class="reset-modal-actions">
                <button class="btn-confirm-no" id="resetCancelBtn">Yo'q</button>
                <button class="btn-confirm-yes" id="resetConfirmBtn">Ha, tozalansin</button>
            </div>
        </div>
    </div>

    <!-- ADMIN PANEL MODAL -->
    <div class="modal-overlay" id="adminModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Sozlamalar</h3>
                <button class="close-modal" id="adminCloseBtn">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
                    </svg>
                </button>
            </div>

            <div class="admin-section">
                <label for="fontSizeRange">Shrift kattaligi: <span id="fontSizeVal">1.10</span>rem</label>
                <input type="range" id="fontSizeRange" min="0.9" max="1.5" step="0.05" value="1.10">
            </div>

            <div class="admin-section">
                <label for="newDuoInput">Yangi duo qo'shish:</label>
                <textarea id="newDuoInput" placeholder="Duoni shu yerga yozing..."></textarea>
                <button class="btn-primary" id="addDuoBtn">Qo'shish</button>
            </div>

            <div class="admin-section">
                <label>Duolar ro'yxati (<span id="duoCountLabel">0</span> ta):</label>
                <div class="duo-list-admin" id="duoListAdmin"></div>
            </div>
        </div>
    </div>

    <script>
        const storage = {
            getItem(key) {
                try { return localStorage.getItem(key); } catch (e) { return null; }
            },
            setItem(key, value) {
                try { localStorage.setItem(key, value); } catch (e) { }
            }
        };

        let duolar = JSON.parse(storage.getItem('duo_list')) || [
            "Ya Fattahu, Iftah li abwaba rahmatik",
            "Allohuma ahrimniy lazzata masiyatak varzuqniy lazzata toatak",
            "Bismillahillaziy laa yazurru ma’asmihi shay’un fil-arzi va laa fis-samaa’i va huvas-samiy’ul-‘aliym."
        ];

        const counterDisplay = document.getElementById('counterDisplay');
        const timerDisplay = document.getElementById('timerDisplay');
        const duoDisplay = document.getElementById('duoDisplay');
        const plusBtn = document.getElementById('plusBtn');
        const resetBtn = document.getElementById('resetBtn');
        const confettiContainer = document.getElementById('confettiContainer');

        const adminModal = document.getElementById('adminModal');
        const adminOpenBtn = document.getElementById('adminOpenBtn');
        const adminCloseBtn = document.getElementById('adminCloseBtn');

        const resetConfirmModal = document.getElementById('resetConfirmModal');
        const resetConfirmBtn = document.getElementById('resetConfirmBtn');
        const resetCancelBtn = document.getElementById('resetCancelBtn');

        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const soundToggleBtn = document.getElementById('soundToggleBtn');
        const freezeToggleBtn = document.getElementById('freezeToggleBtn');
        const vibroToggleBtn = document.getElementById('vibroToggleBtn');

        const fontSizeRange = document.getElementById('fontSizeRange');
        const fontSizeVal = document.getElementById('fontSizeVal');
        const newDuoInput = document.getElementById('newDuoInput');
        const addDuoBtn = document.getElementById('addDuoBtn');
        const duoListAdmin = document.getElementById('duoListAdmin');
        const duoCountLabel = document.getElementById('duoCountLabel');

        let count = parseInt(storage.getItem('duo_count')) || 0;
        let totalSeconds = parseInt(storage.getItem('duo_seconds')) || 0;
        let soundEnabled = storage.getItem('duo_sound') !== 'false';
        let isFrozen = storage.getItem('duo_frozen') === 'true';
        let vibroEnabled = storage.getItem('duo_vibro') !== 'false';

        updateVibroUI();
        updateSoundUI();

        function updateVibroUI() {
            vibroToggleBtn.style.opacity = vibroEnabled ? '1' : '0.4';
            vibroToggleBtn.title = vibroEnabled ? "Tebranish yoni (O'chirish)" : "Tebranish o'chiq (Yoqish)";
        }

        function updateSoundUI() {
            soundToggleBtn.style.opacity = soundEnabled ? '1' : '0.4';
            soundToggleBtn.title = soundEnabled ? "Ovoz yoni (O'chirish)" : "Ovoz o'chiq (Yoqish)";
        }

        function updateFreezeUI() {
            if (isFrozen) {
                freezeToggleBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
                freezeToggleBtn.classList.add('active-freeze');
                freezeToggleBtn.title = "Davom etish (Unfreeze)";
            } else {
                freezeToggleBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
                freezeToggleBtn.classList.remove('active-freeze');
                freezeToggleBtn.title = "Pauza (Freeze)";
            }
        }
        updateFreezeUI();

        let audioCtx = null;
        function playClickSound() {
            if (!soundEnabled) return;
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.03);

                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.03);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.03);
            } catch (e) { }
        }

        function triggerVibration() {
            if (vibroEnabled && navigator.vibrate) {
                try { navigator.vibrate(35); } catch (e) { }
            }
        }

        let usedDuos = JSON.parse(storage.getItem('duo_used_list')) || [];

        function getNextNonRepeatingDuo() {
            if (duolar.length === 0) return "Duolar mavjud emas.";

            if (usedDuos.length >= duolar.length) {
                usedDuos = [];
            }

            let availableDuos = duolar.filter((_, idx) => !usedDuos.includes(idx));
            if (availableDuos.length === 0) {
                usedDuos = [];
                availableDuos = [...duolar];
            }

            let randomSubIndex = Math.floor(Math.random() * availableDuos.length);
            let selectedDuoText = availableDuos[randomSubIndex];
            let originalIndex = duolar.indexOf(selectedDuoText);

            usedDuos.push(originalIndex);
            storage.setItem('duo_used_list', JSON.stringify(usedDuos));

            return selectedDuoText;
        }

        let currentDuo = storage.getItem('current_duo');
        currentDuo = getNextNonRepeatingDuo();
        storage.setItem('current_duo', currentDuo);

        let savedFontSize = storage.getItem('duo_font_size') || '1.10';
        duoDisplay.style.fontSize = savedFontSize + 'rem';
        fontSizeRange.value = savedFontSize;
        fontSizeVal.textContent = savedFontSize;

        let savedTheme = storage.getItem('duo_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        themeToggleBtn.innerHTML = savedTheme === 'dark'
            ? '<svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-3.03 0-5.5-2.47-5.5-5.5 0-1.82.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>'
            : '<svg viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1z"/></svg>';

        counterDisplay.textContent = count;
        duoDisplay.textContent = currentDuo;

        updateTimerDisplay();
        startTimer();

        function updateTimerDisplay() {
            const hours = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
            const minutes = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
            const seconds = String(totalSeconds % 60).padStart(2, '0');
            timerDisplay.textContent = `${hours}:${minutes}:${seconds}`;
        }

        function startTimer() {
            setInterval(() => {
                if (!isFrozen) {
                    totalSeconds++;
                    storage.setItem('duo_seconds', totalSeconds);
                    updateTimerDisplay();
                }
            }, 1000);
        }

        function triggerSurprise() {
            for (let i = 0; i < 18; i++) {
                let confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.top = Math.random() * 30 + '%';
                confettiContainer.appendChild(confetti);

                setTimeout(() => confetti.remove(), 1400);
            }
        }

        function checkMilestoneCross(prev, current) {
            let prevMilestone = Math.floor(prev / 100);
            let currentMilestone = Math.floor(current / 100);
            return currentMilestone > prevMilestone;
        }

        function addCount(amount) {
            if (isFrozen) return;

            playClickSound();
            triggerVibration();

            let prevCount = count;
            count += amount;

            counterDisplay.textContent = count;
            storage.setItem('duo_count', count);

            if (checkMilestoneCross(prevCount, count)) {
                triggerSurprise();
                currentDuo = getNextNonRepeatingDuo();
                storage.setItem('current_duo', currentDuo);

                duoDisplay.style.animation = 'none';
                duoDisplay.offsetHeight;
                duoDisplay.style.animation = 'fadeIn 0.3s ease';
                duoDisplay.textContent = currentDuo;
            }
        }

        plusBtn.addEventListener('click', () => {
            addCount(1);
        });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && document.activeElement.tagName !== 'TEXTAREA' && document.activeElement.tagName !== 'INPUT') {
                e.preventDefault();
                addCount(1);
            }
        });

        freezeToggleBtn.addEventListener('click', () => {
            isFrozen = !isFrozen;
            storage.setItem('duo_frozen', isFrozen);
            updateFreezeUI();
        });

        /* Glass Matte Floating Reset Confirm Modali */
        resetBtn.addEventListener('click', () => {
            resetConfirmModal.classList.add('active');
        });

        resetCancelBtn.addEventListener('click', () => {
            resetConfirmModal.classList.remove('active');
        });

        resetConfirmBtn.addEventListener('click', () => {
            count = 0;
            totalSeconds = 0;
            isFrozen = false;
            usedDuos = [];
            currentDuo = getNextNonRepeatingDuo();

            storage.setItem('duo_count', count);
            storage.setItem('duo_seconds', totalSeconds);
            storage.setItem('duo_frozen', isFrozen);
            storage.setItem('duo_used_list', JSON.stringify(usedDuos));
            storage.setItem('current_duo', currentDuo);

            counterDisplay.textContent = count;
            timerDisplay.textContent = "00:00:00";
            duoDisplay.textContent = currentDuo;
            updateFreezeUI();

            resetConfirmModal.classList.remove('active');
        });

        soundToggleBtn.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            storage.setItem('duo_sound', soundEnabled);
            updateSoundUI();
        });

        vibroToggleBtn.addEventListener('click', () => {
            vibroEnabled = !vibroEnabled;
            storage.setItem('duo_vibro', vibroEnabled);
            updateVibroUI();
            if (vibroEnabled) triggerVibration();
        });

        adminOpenBtn.addEventListener('click', () => {
            renderAdminDuoList();
            adminModal.classList.add('active');
        });

        adminCloseBtn.addEventListener('click', () => {
            adminModal.classList.remove('active');
        });

        [adminModal, resetConfirmModal].forEach(modal => {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) modal.classList.remove('active');
            });
        });

        themeToggleBtn.addEventListener('click', () => {
            let currentTheme = document.documentElement.getAttribute('data-theme');
            let newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            storage.setItem('duo_theme', newTheme);
            themeToggleBtn.innerHTML = newTheme === 'dark'
                ? '<svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-3.03 0-5.5-2.47-5.5-5.5 0-1.82.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>'
                : '<svg viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1z"/></svg>';
        });

        fontSizeRange.addEventListener('input', (e) => {
            let val = e.target.value;
            fontSizeVal.textContent = val;
            duoDisplay.style.fontSize = val + 'rem';
            storage.setItem('duo_font_size', val);
        });

        addDuoBtn.addEventListener('click', () => {
            let text = newDuoInput.value.trim();
            if (text) {
                duolar.push(text);
                storage.setItem('duo_list', JSON.stringify(duolar));
                newDuoInput.value = '';
                renderAdminDuoList();
            }
        });

        function renderAdminDuoList() {
            duoListAdmin.innerHTML = '';
            duoCountLabel.textContent = duolar.length;
            if (duolar.length === 0) {
                duoListAdmin.innerHTML = '<span style="color:var(--timer-color); font-size:0.75rem; text-align:center; padding:5px;">Ro\'yxat bo\'sh</span>';
                return;
            }
            duolar.forEach((duo, index) => {
                let item = document.createElement('div');
                item.className = 'duo-item-admin';
                item.innerHTML = `
                    <div class="duo-item-top" id="view-mode-${index}">
                        <span>${index + 1}. ${duo}</span>
                        <div class="duo-item-actions">
                            <button class="btn-action btn-edit" onclick="toggleEdit(${index}, true)">
                                <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                                Tahrir
                            </button>
                            <button class="btn-action btn-delete" onclick="deleteDuo(${index})">
                                <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                                O'chirish
                            </button>
                        </div>
                    </div>
                    <div class="duo-edit-area" id="edit-mode-${index}">
                        <textarea id="edit-input-${index}">${duo}</textarea>
                        <div class="duo-item-actions">
                            <button class="btn-action btn-save" onclick="saveDvur(${index})">
                                <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                                Tasdiqlash
                            </button>
                            <button class="btn-action btn-cancel" onclick="toggleEdit(${index}, false)">
                                <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                                Bekor
                            </button>
                        </div>
                    </div>
                `;
                duoListAdmin.appendChild(item);
            });
        }

        window.toggleEdit = function (index, isEditing) {
            document.getElementById(`view-mode-${index}`).style.display = isEditing ? 'none' : 'flex';
            document.getElementById(`edit-mode-${index}`).style.display = isEditing ? 'flex' : 'none';
        }

        window.saveDvur = function (index) {
            let textarea = document.getElementById(`edit-input-${index}`);
            let updatedText = textarea.value.trim();
            if (!updatedText) {
                alert("Duo matni bo'sh bo'lishi mumkin emas!");
                return;
            }

            let oldText = duolar[index];
            duolar[index] = updatedText;
            storage.setItem('duo_list', JSON.stringify(duolar));

            if (currentDuo === oldText) {
                currentDuo = updatedText;
                storage.setItem('current_duo', currentDuo);
                duoDisplay.textContent = currentDuo;
            }

            renderAdminDuoList();
        }

        window.deleteDuo = function (index) {
            if (duolar.length <= 1) {
                alert("Eng kamida bitta duo qolishi kerak!");
                return;
            }
            let deletedDuo = duolar[index];
            duolar.splice(index, 1);
            storage.setItem('duo_list', JSON.stringify(duolar));

            usedDuos = [];
            storage.setItem('duo_used_list', JSON.stringify(usedDuos));

            if (currentDuo === deletedDuo) {
                currentDuo = getNextNonRepeatingDuo();
                storage.setItem('current_duo', currentDuo);
                duoDisplay.textContent = currentDuo;
            }
            renderAdminDuoList();
        }

        let deferredPrompt;
        const pwaBanner = document.getElementById('pwaInstallBanner');
        const pwaInstallBtn = document.getElementById('pwaInstallBtn');
        const pwaDismissBtn = document.getElementById('pwaDismissBtn');

        // Qurilma ilova sifatida ochilganini tekshirish (Standalone check)
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

        if (!isStandalone) {
            // Android / Chromium brauzerlari uchun o'rnatish voqeasini tutib olish
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;

                // Foydalanuvchiga silliq ko'rinishi uchun 1.5 soniyadan so'ng chiqaramiz
                setTimeout(() => {
                    pwaBanner.classList.add('show');
                }, 1500);
            });

            // iPhone (iOS) Safari brauzeri uchun
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
            if (isIOS) {
                setTimeout(() => {
                    pwaBanner.classList.add('show');
                }, 1500);
            }
        }

        // "Yuklab olish" tugmasi bosilganda
        pwaInstallBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                pwaBanner.classList.remove('show');
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                deferredPrompt = null;
            } else {
                // iOS foydalanuvchilariga tushunarli eslatma
                alert("iPhone-ga o'rnatish uchun:\n1. Pastdagi 'Ulashish' (Share) tugmasini bosing.\n2. 'Ekranga qo'shish' (Add to Home Screen) opsiyasini tanlang.");
                pwaBanner.classList.remove('show');
            }
        });

        // "Keyinroq" tugmasi bosilganda oynani yopish
        pwaDismissBtn.addEventListener('click', () => {
            pwaBanner.classList.remove('show');
        });

    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker ro\'yxatdan o\'tdi:', reg))
                    .catch(err => console.log('Service Worker xatosi:', err));
            });
        }
    </script>
</body>
